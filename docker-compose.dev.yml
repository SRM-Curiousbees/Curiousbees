version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: srm_curiousbees_redis_dev
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    container_name: srm_curiousbees_api_dev
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run db:generate && npm run dev:api"
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 4000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEVELOPMENT_MODE: "true"
      FRONTEND_URL: http://localhost:3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
    depends_on:
      redis:
        condition: service_healthy

  web:
    image: node:22-alpine
    container_name: srm_curiousbees_web_dev
    working_dir: /app
    command: sh -c "npm install --legacy-peer-deps && npm run dev:web"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_DEVELOPMENT_MODE: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/api/node_modules
    depends_on:
      - api

# Disposable infrastructure for the API integration suite (apps/api/test).
#
#   docker compose -f docker-compose.test.yml up -d
#   cd apps/api && E2E_DATABASE_URL="postgresql://cbtest:cbtest_local_only@127.0.0.1:55432/curiousbees?schema=public" \
#     E2E_S3_ENDPOINT=http://127.0.0.1:59000 npm run test:e2e
#   docker compose -f docker-compose.test.yml down
#
# The suite drops and recreates the database schema, so it refuses to run
# against anything except this endpoint (see apps/api/test/e2e-safety.ts).
# Both services listen on 127.0.0.1 only, the database lives in memory, and the
# credentials are test-only. A separate project name keeps `down` away from the
# development stack.
name: curiousbees-test

services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cbtest
      POSTGRES_PASSWORD: cbtest_local_only
      POSTGRES_DB: curiousbees
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbtest -d curiousbees"]
      interval: 2s
      timeout: 5s
      retries: 30

  test-s3:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
      S3_SKIP_SIGNATURE_VALIDATION: "0"
    ports:
      - "127.0.0.1:59000:4566"

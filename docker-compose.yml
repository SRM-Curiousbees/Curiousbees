version: "3.8"

services:
  # CuriousBees Backend API (NestJS) connected to cloud Supabase PostgreSQL
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: srm_curiousbees_api
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"

  # CuriousBees Frontend Web App (Next.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS: ${NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS:-}
    container_name: srm_curiousbees_web
    restart: always
    environment:
      APP_URL: http://localhost:3000
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

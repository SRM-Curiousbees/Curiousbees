version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: srm_curiousbees_postgres
    restart: always
    # POSTGRES_PASSWORD comes from .env.docker (git-ignored; see .env.docker.example).
    env_file: .env.docker
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: srm_curiousbees_db
    # Not published to the host: the API reaches it on the compose network. Port
    # 5432 on this machine belongs to the local Homebrew server; if you need host
    # access, publish "127.0.0.1:5433:5432", never 5432 or all interfaces.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d srm_curiousbees_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local run of the production images. NODE_ENV stays "development" so the API
  # accepts http://localhost origins; production strictness is exercised in CI/ECS.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: srm_curiousbees_api
    restart: always
    # .env.docker comes last so its DATABASE_URL (the compose database) wins over .env.
    env_file:
      - .env
      - .env.docker
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS: ${NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS:-}
    container_name: srm_curiousbees_web
    restart: always
    environment:
      APP_URL: http://localhost:3000
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
    driver: local

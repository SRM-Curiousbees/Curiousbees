name: CuriousBees CI/CD

# validate  : every PR and push — lint, typecheck, unit + integration tests, Prisma
#             validation, fresh-database `prisma migrate deploy`, production builds.
# images    : pushes to main — build ARM64 images, push to ECR (GitHub OIDC, no keys).
# deploy    : after `images`, gated by the "production" GitHub environment
#             (required reviewers) — migrate, roll out ECS services, health-check.
#
# AWS access is only via OIDC: the "production" environment holds the role ARN
# as a variable. No AWS access keys exist in GitHub. See docs/deployment/aws-production.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  AWS_REGION: ap-south-1
  ECS_CLUSTER: curiousbees-prod
  ECR_API: curiousbees-api
  ECR_WEB: curiousbees-web
  APP_URL: https://srmcuriousbees.in

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: curiousbees_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d curiousbees_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      s3:
        image: localstack/localstack:4
        env:
          SERVICES: s3
          S3_SKIP_SIGNATURE_VALIDATION: "0"
        ports: ["4566:4566"]
    env:
      DATABASE_URL: postgresql://ci:ci_only@localhost:5432/curiousbees_ci?schema=public
      DIRECT_URL: postgresql://ci:ci_only@localhost:5432/curiousbees_ci?schema=public
      # Public placeholders so the Next.js build-time validation passes in CI.
      NEXT_PUBLIC_SITE_URL: https://srmcuriousbees.in
      NEXT_PUBLIC_API_URL: https://srmcuriousbees.in
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prisma validate + generate
        run: |
          npx prisma validate --schema apps/api/prisma/schema.prisma
          npm run db:generate

      - name: Build shared packages
        run: npm run build:packages

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --silent

      - name: Migration has no drift from schema.prisma
        run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          npx prisma migrate diff --from-url "$DATABASE_URL" \
            --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code

      - name: Integration tests (fresh DB + S3 emulator)
        working-directory: apps/api
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
          E2E_S3_ENDPOINT: http://localhost:4566
        run: npm run test:e2e -- --silent

      - name: Production builds
        env:
          NODE_ENV: production
        run: npm run build

  images:
    name: Build & push images (ARM64)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Native ARM64 runner for Graviton Fargate tasks. Override with the ARM_RUNNER variable if needed.
    runs-on: ${{ vars.ARM_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image names
        id: meta
        run: |
          echo "api_image=${{ steps.ecr.outputs.registry }}/${ECR_API}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ steps.ecr.outputs.registry }}/${ECR_WEB}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build & push API image
        run: |
          docker build -f Dockerfile.api -t "${{ steps.meta.outputs.api_image }}" .
          docker push "${{ steps.meta.outputs.api_image }}"

      - name: Build & push web image
        # Only PUBLIC values are passed as build args (they end up in the browser bundle).
        run: |
          docker build -f Dockerfile.web \
            --build-arg NEXT_PUBLIC_SITE_URL="$APP_URL" \
            --build-arg NEXT_PUBLIC_API_URL="$APP_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS="${{ vars.ALLOWED_EMAIL_DOMAINS }}" \
            -t "${{ steps.meta.outputs.web_image }}" .
          docker push "${{ steps.meta.outputs.web_image }}"

  deploy:
    name: Deploy to production
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://srmcuriousbees.in
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      ALLOWED_EMAIL_DOMAINS: ${{ vars.ALLOWED_EMAIL_DOMAINS }}
      MAIL_FROM_EMAIL: ${{ vars.MAIL_FROM_EMAIL }}
      API_IMAGE: ${{ needs.images.outputs.api_image }}
      WEB_IMAGE: ${{ needs.images.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definitions
        run: |
          infra/aws/scripts/render.sh infra/aws/ecs/api-task-definition.json > api-td.json
          infra/aws/scripts/render.sh infra/aws/ecs/web-task-definition.json > web-td.json

      - name: Register API task definition
        id: api_td
        run: |
          arn=$(aws ecs register-task-definition --cli-input-json file://api-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Database migrations + reference seed (prisma migrate deploy)
        env:
          TASK_DEFINITION_ARN: ${{ steps.api_td.outputs.arn }}
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
          ECS_API_SECURITY_GROUP: ${{ vars.ECS_API_SECURITY_GROUP }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
        run: infra/aws/scripts/run-migrations.sh

      - name: Deploy API service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: api-td.json
          service: curiousbees-api
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: web-td.json
          service: curiousbees-web
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Post-deploy health check
        run: |
          for path in /api/health/live /api/health /healthz; do
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL$path" || true)
              [[ "$status" == "200" ]] && { echo "OK $path"; break; }
              [[ $attempt == 6 ]] && { echo "FAILED $path ($status)"; exit 1; }
              sleep 10
            done
          done
